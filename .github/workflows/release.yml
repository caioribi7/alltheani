name: Release do alltheani

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: alltheani-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: alltheani-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: alltheani-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: alltheani-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Testes
        run: cargo test
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Renomear binário
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/alltheani$ext" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum alltheani-* > SHA256SUMS && cat SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
