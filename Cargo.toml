[package]
name = "alltheani"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Painel no terminal que encontra e suaviza as transições de qualquer projeto Next.js"
repository = "https://github.com/caioribi7/alltheani"
readme = "README.md"
keywords = ["nextjs", "animation", "transitions", "codemod", "tui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
exclude = ["fixtures/", "npm/", ".github/"]

[[bin]]
name = "alltheani"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ignore = "0.4"
oxc_allocator = "0.159"
oxc_ast = "0.159"
oxc_ast_visit = "0.159"
oxc_parser = "0.159"
oxc_span = "0.159"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
